services:
  app:
    build: .
    command: sh -c "php artisan migrate --force && exec php artisan serve --host=0.0.0.0 --port=8080"
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "8001:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-billing}
      POSTGRES_USER: ${DB_USERNAME:-billing}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-billing}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
