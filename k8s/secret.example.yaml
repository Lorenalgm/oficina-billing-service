# Não entra no kustomization. Crie com valores reais:
#   kubectl -n oficina create secret generic billing-secrets \
#     --from-literal=APP_KEY="$(php artisan key:generate --show)" \
#     --from-literal=DB_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: billing-secrets
type: Opaque
stringData:
  APP_KEY: "base64:SUBSTITUA"
  DB_PASSWORD: "SUBSTITUA"
