apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-config
  labels:
    app.kubernetes.io/part-of: oficina-billing
data:
  APP_NAME: "oficina-billing-service"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://localhost:8080"
  LOG_CHANNEL: "stderr"
  LOG_STDERR_FORMATTER: "Monolog\\Formatter\\JsonFormatter"
  LOG_LEVEL: "info"
  DB_CONNECTION: "pgsql"
  DB_HOST: "billing-postgres"
  DB_PORT: "5432"
  DB_DATABASE: "billing"
  DB_USERNAME: "billing"
  CACHE_STORE: "array"
  SESSION_DRIVER: "array"
  QUEUE_CONNECTION: "sync"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "oficina"
  RABBITMQ_USER: "billing"
  MENSAGERIA_FILA: "billing.comandos"
  PAYMENT_GATEWAY: "fake"
