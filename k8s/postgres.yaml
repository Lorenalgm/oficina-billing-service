apiVersion: v1
kind: Service
metadata:
  name: billing-postgres
  labels:
    app.kubernetes.io/name: billing-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: billing-postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: billing-postgres
  labels:
    app.kubernetes.io/name: billing-postgres
spec:
  serviceName: billing-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: billing
            - name: POSTGRES_USER
              value: billing
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: dados
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "billing", "-d", "billing"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
